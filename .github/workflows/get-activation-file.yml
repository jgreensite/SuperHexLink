name: Get Unity Activation File
# ONE-TIME USE ONLY — delete this file after getting the .ulf
# Run this workflow, download the artifact, convert at https://license.unity3d.com/manual
on:
  workflow_dispatch:

jobs:
  get-activation-file:
    name: Get Unity Activation File
    runs-on: ubuntu-latest
    steps:
      - name: Request Unity Activation File
        id: getManualLicenseFile
        uses: game-ci/unity-activate@v2
        with:
          unityVersion: 2021.3.18f1

      - name: Upload Activation File
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v2021.3.18f1.alf
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
          retention-days: 1
